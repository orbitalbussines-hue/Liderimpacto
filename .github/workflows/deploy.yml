# CI/CD — Líder de Impacto (ADR-0017: PRODUÇÃO direto, sem homologação)
#
#   PR e push em qualquer branch -> CI (verificação)
#   push em `develop`            -> só o CI (não há HML; mudança grande se valida no compose local)
#   push/merge em `master`       -> CI -> imagens no GHCR (SHA + `prd`) -> gatilhos do Easypanel:
#                                   li-ferramentas (BACKUP do banco no R2 -> migração) -> app, workers,
#                                   backup -> confere https://liderdeimpacto.com.br/api/saude
#   Run workflow com `versao`    -> volta a PRD para aquele SHA (sem rebuild; o backup roda de novo)
#
# Por que o auditor roda AQUI: o hook de pre-commit pode ser pulado
# (`--no-verify`, clone sem `npm install`). O CI e a unica barreira que nenhum
# agente (Codex, Cursor, Claude) nem pessoa consegue contornar.
#
# BACKUP ANTES DO DEPLOY (regra da base): o CI não alcança o banco. Quem faz é o li-ferramentas, que ao
# subir roda `backup pre-deploy` (pg_dump para o R2, banco/pre-deploy/) e SÓ ENTÃO migra e grava a
# marca da versão no banco; app e workers novos só ficam saudáveis com essa marca (VERSAO_IMAGEM =
# SHA, src/lib/db/migracoes.ts). Backup falhou = a versão anterior segue no ar
# (deploy/easypanel/ferramentas.sh, docs/deploy-easypanel.md).
#
# Environment `prd` (Settings > Environments), secrets:
#   EASYPANEL_DEPLOY_WEBHOOK_FERRAMENTAS / _APP / _WORKER_VIDEO / _WORKER_CERTIFICADOS / _BACKUP
#     (Deployment Trigger URL de cada serviço do Easypanel. O GHCR usa o GITHUB_TOKEN do job.)
# Variáveis de repositório: PRD_ATIVO=true liga os gatilhos (sem ela o job só publica as imagens e
#   avisa); PRD_S3_ENDPOINT (opcional) troca o host público do storage que entra no build do app.

name: CI/CD

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:
    inputs:
      versao:
        description: "Voltar a PRODUCAO para este SHA (vazio = so roda o CI)"
        required: false
        default: ""

# Evita duas execuções simultâneas na mesma branch (os jobs de PRD têm ainda o grupo `prd`).
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1) CI — roda em TODO push e TODA PR. Travas de fonte primeiro: retorno rapido.
  # ---------------------------------------------------------------------------
  ci:
    name: Verificar (auditor + lint + tipos + testes + build)
    runs-on: ubuntu-latest
    # Testes de integracao rodam no PostgreSQL REAL (nunca SQLite). Credenciais so do CI efemero.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lider_impacto_teste
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dev" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TESTE: postgres://dev:dev@localhost:5432/lider_impacto_teste
      # O build carrega o Better Auth: segredo e URL de mentira so para compilar.
      BETTER_AUTH_SECRET: segredo-de-ci-so-para-compilar-e-testar-0123456789
      BETTER_AUTH_URL: https://ci.invalido
      PLATAFORMA_DOMINIO: ci.invalido
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"  # mesma do dev e das imagens: o npm 11.19+ recusa este lockfile
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: 1. Auditor de conformidade
        run: npm run compliance

      - name: 2. Trava do auditor
        run: npm run test:compliance

      - name: 3. Marcas invisiveis de IA nos docs
        run: npm run ai-marks

      - name: 4. Lint
        run: npm run lint

      - name: 5. Type check
        run: npm run typecheck

      - name: 6a. Migracoes no banco de teste
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://dev:dev@localhost:5432/lider_impacto_teste

      - name: 6. Testes
        run: npm test

      - name: 7. Drift entre codigo e docs (informativo)
        run: npm run docs:check

      - name: 8. Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # 2) Deploy PRD — push na master, DEPOIS do CI verde (ADR-0017, runbook docs/deploy-easypanel.md).
  #
  #   1. constrói as imagens (app, worker, backup) AQUI, não na VPS, e publica no GHCR com tag = SHA
  #      e a tag móvel `prd` (a que os serviços do Easypanel puxam). VERSAO_IMAGEM = SHA nas imagens.
  #   2. PRD_ATIVO=true: chama a Deployment Trigger URL de cada serviço (li-ferramentas primeiro:
  #      backup -> migração -> marca da versão; depois app, workers e backup). Auto Deploy DESLIGADO
  #      no Easypanel: nada vai ao ar sem o CI.
  #   3. confere de fora (DNS + TLS + app + banco): GET https://liderdeimpacto.com.br/api/saude = 200.
  #      Isto vê o site no ar; a troca de versão se confere na aba Deployments (a anterior segue
  #      atendendo até a nova ficar saudável).
  # O job da HML saiu (ADR-0017): não há HML para receber deploy. Recriar = histórico do git + ADR-0016.
  # ---------------------------------------------------------------------------
  deploy-prd:
    name: Deploy PRD (Easypanel)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: prd
    concurrency:
      group: prd
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      REGISTRO: ghcr.io/orbitalbussines-hue/liderimpacto
      # Não é segredo: o host público do storage entra no build do app (next.config.ts, images).
      S3_ENDPOINT_PUBLICO: ${{ vars.PRD_S3_ENDPOINT || 'https://s3.liderdeimpacto.com.br' }}
      URL_SAUDE: https://liderdeimpacto.com.br/api/saude
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR (publicar)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Imagem do app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/app.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRO }}-app:${{ github.sha }}
            ${{ env.REGISTRO }}-app:prd
          build-args: |
            S3_ENDPOINT=${{ env.S3_ENDPOINT_PUBLICO }}
            VERSAO_IMAGEM=${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Imagem dos workers e ferramentas (pg_dump 16 + rclone do backup pre-deploy)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/worker.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRO }}-worker:${{ github.sha }}
            ${{ env.REGISTRO }}-worker:prd
          build-args: |
            VERSAO_IMAGEM=${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

      - name: Imagem do backup (pg_dump 16 + rclone)
        uses: docker/build-push-action@v6
        with:
          context: deploy/easypanel
          file: deploy/easypanel/backup.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRO }}-backup:${{ github.sha }}
            ${{ env.REGISTRO }}-backup:prd
          cache-from: type=gha,scope=backup
          cache-to: type=gha,scope=backup,mode=max

      - name: PRD ainda desligada (so imagens publicadas)
        if: vars.PRD_ATIVO != 'true'
        run: echo "::warning::PRD_ATIVO != true - imagens publicadas (tag prd), deploy NAO disparado (docs/deploy-easypanel.md)."

      - name: Disparar o deploy no Easypanel (li-ferramentas faz o backup e migra antes)
        id: disparo
        if: vars.PRD_ATIVO == 'true'
        env:
          EASYPANEL_DEPLOY_WEBHOOK_FERRAMENTAS: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK_FERRAMENTAS }}
          EASYPANEL_DEPLOY_WEBHOOK_APP: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK_APP }}
          EASYPANEL_DEPLOY_WEBHOOK_WORKER_VIDEO: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK_WORKER_VIDEO }}
          EASYPANEL_DEPLOY_WEBHOOK_WORKER_CERTIFICADOS: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK_WORKER_CERTIFICADOS }}
          EASYPANEL_DEPLOY_WEBHOOK_BACKUP: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK_BACKUP }}
        run: bash deploy/easypanel/disparar-deploy.sh

      - name: Conferir saude por fora (DNS + TLS + app + banco migrado)
        if: steps.disparo.outputs.disparado == 'true'
        run: |
          sleep 30
          curl -fsS --retry 12 --retry-delay 10 --retry-all-errors --max-time 10 "$URL_SAUDE"
          echo

  # ---------------------------------------------------------------------------
  # 3) Voltar a PRODUÇÃO para uma versão anterior (Actions > CI/CD > Run workflow, branch `master`,
  #    campo "versao" = SHA de um commit da master já publicado). Repõe a tag `prd` nas imagens
  #    daquele SHA e dispara o deploy: o li-ferramentas faz o backup pre-deploy de novo antes de
  #    liberar a versão. Migração só anda para a frente: o código antigo roda sobre o schema novo se a
  #    migração foi aditiva (o padrão); se não, restaure o backup (runbook).
  # ---------------------------------------------------------------------------
  voltar-prd:
    name: Voltar versao da PRD (Easypanel)
    if: github.event_name == 'workflow_dispatch' && inputs.versao != ''
    runs-on: ubuntu-latest
    environment: prd
    concurrency:
      group: prd
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      REGISTRO: ghcr.io/orbitalbussines-hue/liderimpacto
      VERSAO: ${{ inputs.versao }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Conferir a versao pedida
        run: |
          [[ "$VERSAO" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::versao = SHA completo (40 caracteres hex)"; exit 1; }

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apontar a tag prd para a versao pedida
        run: |
          for img in app worker backup; do
            docker buildx imagetools create -t "$REGISTRO-$img:prd" "$REGISTRO-$img:$VERSAO"
          done

      - name: Disparar o deploy no Easypanel
        env:
          EASYPANEL_DEPLOY_WEBHOOK_FERRAMENTAS: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK_FERRAMENTAS }}
          EASYPANEL_DEPLOY_WEBHOOK_APP: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK_APP }}
          EASYPANEL_DEPLOY_WEBHOOK_WORKER_VIDEO: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK_WORKER_VIDEO }}
          EASYPANEL_DEPLOY_WEBHOOK_WORKER_CERTIFICADOS: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK_WORKER_CERTIFICADOS }}
          EASYPANEL_DEPLOY_WEBHOOK_BACKUP: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK_BACKUP }}
        run: bash deploy/easypanel/disparar-deploy.sh
