# CI/CD — Estrutura Base
#
#   PR e push em qualquer branch -> CI (verificacao)
#   push em `develop`            -> CI -> Deploy HML (Homologacao, Easypanel)
#   Run workflow com `versao`    -> volta a HML para aquele SHA (sem rebuild)
#   push em `master`             -> CI -> BACKUP do banco -> Deploy PRD (Producao)
#
# Por que o auditor roda AQUI: o hook de pre-commit pode ser pulado
# (`--no-verify`, clone sem `npm install`). O CI e a unica barreira que nenhum
# agente (Codex, Cursor, Claude) nem pessoa consegue contornar.
#
# Secrets necessarios (Settings > Secrets and variables > Actions, por
# Environment `hml` e `prd`):
#   EASYPANEL_DEPLOY_WEBHOOK_FERRAMENTAS / _APP / _WORKER_VIDEO / _WORKER_CERTIFICADOS / _BACKUP
#     (HML = imagens no GHCR + Deployment Trigger URL de cada servico do Easypanel, ADR-0016 /
#      docs/deploy-easypanel.md. O GHCR usa o GITHUB_TOKEN do proprio job.)
#   Variaveis de repositorio: HML_ATIVO=true liga o deploy; HML_S3_ENDPOINT (opcional) troca o
#     host publico do storage que entra no build do app.
#   PRD_SSH_HOST / PRD_SSH_USER / PRD_SSH_KEY / PRD_KNOWN_HOSTS / PRD_APP_DIR
#   PRD_DATABASE_URL   (string de conexao usada no pg_dump antes do deploy PRD)
#   PRD_BACKUP_DEST    (destino do backup FORA do servidor do banco)

name: CI/CD

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:
    inputs:
      versao:
        description: "Voltar a HML para este SHA (vazio = so roda o CI)"
        required: false
        default: ""

# Evita dois deploys simultaneos no mesmo ambiente.
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1) CI — roda em TODO push e TODA PR. Travas de fonte primeiro: retorno rapido.
  # ---------------------------------------------------------------------------
  ci:
    name: Verificar (auditor + lint + tipos + testes + build)
    runs-on: ubuntu-latest
    # Testes de integracao rodam no PostgreSQL REAL (nunca SQLite). Credenciais so do CI efemero.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lider_impacto_teste
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dev" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TESTE: postgres://dev:dev@localhost:5432/lider_impacto_teste
      # O build carrega o Better Auth: segredo e URL de mentira so para compilar.
      BETTER_AUTH_SECRET: segredo-de-ci-so-para-compilar-e-testar-0123456789
      BETTER_AUTH_URL: https://ci.invalido
      PLATAFORMA_DOMINIO: ci.invalido
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"  # mesma do dev e das imagens: o npm 11.19+ recusa este lockfile
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: 1. Auditor de conformidade
        run: npm run compliance

      - name: 2. Trava do auditor
        run: npm run test:compliance

      - name: 3. Marcas invisiveis de IA nos docs
        run: npm run ai-marks

      - name: 4. Lint
        run: npm run lint

      - name: 5. Type check
        run: npm run typecheck

      - name: 6a. Migracoes no banco de teste
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://dev:dev@localhost:5432/lider_impacto_teste

      - name: 6. Testes
        run: npm test

      - name: 7. Drift entre codigo e docs (informativo)
        run: npm run docs:check

      - name: 8. Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # 2) Deploy HML — somente push na develop, DEPOIS do CI verde (ADR-0016, runbook
  #    docs/deploy-easypanel.md). A HML mora no Easypanel da VPS da página de vendas.
  #
  #   1. constrói as imagens (app, worker, backup) AQUI, não na VPS compartilhada, e publica no
  #      GHCR com tag = SHA do commit e a tag móvel `hml` (é a que os serviços do Easypanel puxam)
  #   2. chama a Deployment Trigger URL de cada serviço (secrets EASYPANEL_DEPLOY_WEBHOOK_*):
  #      ferramentas (migra o banco) -> app -> workers -> backup. O auto-deploy do Easypanel fica
  #      DESLIGADO: nada vai ao ar sem o CI.
  #   3. confere de fora (DNS + TLS + app + banco migrado): GET https://<domínio>/api/saude = 200
  #
  # O caminho antigo (VPS crua + compose + SSH, ADR-0015) saiu do CI; os arquivos de deploy/hml/
  # continuam válidos para uma VPS dedicada (docs/deploy-hml.md).
  # ---------------------------------------------------------------------------
  deploy-hml:
    name: Deploy HML (Easypanel)
    needs: ci
    # Liga só depois do Easypanel pronto: variável de repositório HML_ATIVO=true (runbook).
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.HML_ATIVO == 'true'
    runs-on: ubuntu-latest
    environment: hml
    permissions:
      contents: read
      packages: write
    env:
      REGISTRO: ghcr.io/orbitalbussines-hue/liderimpacto
      # Não é segredo: o host público do storage entra no build do app (next.config.ts, images).
      S3_ENDPOINT_PUBLICO: ${{ vars.HML_S3_ENDPOINT || 'https://s3.hml.liderdeimpacto.com.br' }}
      URL_SAUDE: https://hml.liderdeimpacto.com.br/api/saude
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR (publicar)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Imagem do app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/app.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRO }}-app:${{ github.sha }}
            ${{ env.REGISTRO }}-app:hml
          build-args: |
            S3_ENDPOINT=${{ env.S3_ENDPOINT_PUBLICO }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Imagem dos workers e ferramentas
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/worker.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRO }}-worker:${{ github.sha }}
            ${{ env.REGISTRO }}-worker:hml
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

      - name: Imagem do backup (pg_dump 16 + rclone)
        uses: docker/build-push-action@v6
        with:
          context: deploy/easypanel
          file: deploy/easypanel/backup.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRO }}-backup:${{ github.sha }}
            ${{ env.REGISTRO }}-backup:hml
          cache-from: type=gha,scope=backup
          cache-to: type=gha,scope=backup,mode=max

      # Não é usada no Easypanel: mantém pronta a alternativa de VPS dedicada (compose + Caddy,
      # ADR-0015, docs/deploy-hml.md), que puxa app/worker/caddy pela mesma tag do SHA.
      - name: Imagem do Caddy (alternativa VPS dedicada)
        uses: docker/build-push-action@v6
        with:
          context: deploy/hml
          file: deploy/hml/caddy.Dockerfile
          push: true
          tags: ${{ env.REGISTRO }}-caddy:${{ github.sha }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,scope=caddy,mode=max

      - name: Disparar o deploy no Easypanel (ferramentas migra antes)
        id: disparo
        env:
          EASYPANEL_DEPLOY_WEBHOOK_FERRAMENTAS: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK_FERRAMENTAS }}
          EASYPANEL_DEPLOY_WEBHOOK_APP: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK_APP }}
          EASYPANEL_DEPLOY_WEBHOOK_WORKER_VIDEO: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK_WORKER_VIDEO }}
          EASYPANEL_DEPLOY_WEBHOOK_WORKER_CERTIFICADOS: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK_WORKER_CERTIFICADOS }}
          EASYPANEL_DEPLOY_WEBHOOK_BACKUP: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK_BACKUP }}
        run: bash deploy/easypanel/disparar-deploy.sh

      # A versão anterior segue atendendo até a nova responder 200 (deploy sem downtime do Easypanel).
      # Isto confere que o site está no ar; a troca de versão se confere na aba Deployments.
      - name: Conferir saude por fora (DNS + TLS + app + banco migrado)
        if: steps.disparo.outputs.disparado == 'true'
        run: |
          sleep 30
          curl -fsS --retry 12 --retry-delay 10 --retry-all-errors --max-time 10 "$URL_SAUDE"
          echo

  # ---------------------------------------------------------------------------
  # 2b) Voltar a HML para uma versão anterior (Actions > CI/CD > Run workflow, campo "versao" =
  #     SHA de um commit da develop já publicado). Repõe a tag `hml` nas imagens daquele SHA e
  #     dispara o deploy. A doc do Easypanel não tem "rollback"; isto é o rollback.
  #     Migração só anda para a frente: o código antigo roda sobre o schema novo se a migração
  #     foi aditiva (o padrão); se não, restaure o backup (runbook).
  # ---------------------------------------------------------------------------
  voltar-hml:
    name: Voltar versao da HML (Easypanel)
    if: github.event_name == 'workflow_dispatch' && inputs.versao != ''
    runs-on: ubuntu-latest
    environment: hml
    permissions:
      contents: read
      packages: write
    env:
      REGISTRO: ghcr.io/orbitalbussines-hue/liderimpacto
      VERSAO: ${{ inputs.versao }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Conferir a versao pedida
        run: |
          [[ "$VERSAO" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::versao = SHA completo (40 caracteres hex)"; exit 1; }

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apontar a tag hml para a versao pedida
        run: |
          for img in app worker backup; do
            docker buildx imagetools create -t "$REGISTRO-$img:hml" "$REGISTRO-$img:$VERSAO"
          done

      - name: Disparar o deploy no Easypanel
        env:
          EASYPANEL_DEPLOY_WEBHOOK_FERRAMENTAS: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK_FERRAMENTAS }}
          EASYPANEL_DEPLOY_WEBHOOK_APP: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK_APP }}
          EASYPANEL_DEPLOY_WEBHOOK_WORKER_VIDEO: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK_WORKER_VIDEO }}
          EASYPANEL_DEPLOY_WEBHOOK_WORKER_CERTIFICADOS: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK_WORKER_CERTIFICADOS }}
          EASYPANEL_DEPLOY_WEBHOOK_BACKUP: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK_BACKUP }}
        run: bash deploy/easypanel/disparar-deploy.sh

  # ---------------------------------------------------------------------------
  # 3) Deploy PRD — somente branch master, com BACKUP do banco ANTES
  #    ESQUELETO herdado da base (git + pm2). Antes do 1º deploy de PRD, migrar para o modelo da
  #    HML (imagens do GHCR + implantar.sh) com as mudanças do ADR-0015 ("O que muda em produção").
  # ---------------------------------------------------------------------------
  deploy-prd:
    name: Deploy PRD (Producao)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: prd
    steps:
      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRD_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.PRD_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # =======================================================================
      # Disaster Recovery (CLAUDE.md): SEMPRE backup ANTES do deploy PRD, e o
      # backup NUNCA pode ficar so no mesmo servidor do banco.
      #
      # O dump NAO passa pelo runner do GitHub e NAO vira artifact.
      # Um artifact do Actions e baixavel por QUALQUER pessoa com acesso de
      # leitura ao repositorio e fica hospedado por semanas. Um dump de producao
      # carrega nome, endereco, CNPJ e valor de venda de cliente real: isso nao
      # sai do perimetro. A copia off-server e feita HOST -> DESTINO, direto,
      # sem intermediario.
      #
      # PRE-REQUISITO OPERACIONAL (uma vez, fora do CI):
      #   a VPS de banco precisa ter chave SSH propria autorizada no destino de
      #   backup. O CI so dispara o comando; ele nao carrega credencial nenhuma
      #   do destino.
      # Secret necessario: PRD_BACKUP_DEST  (ex.: "backup@10.0.0.9:/srv/backups/mm")
      # =======================================================================
      - name: Definir nome do backup
        id: bk
        run: echo "file=backup_$(date +%d_%m_%Y_%H_%M).sql" >> "$GITHUB_OUTPUT"

      - name: Exigir destino de backup off-server
        env:
          DEST: ${{ secrets.PRD_BACKUP_DEST }}
        run: |
          if [ -z "$DEST" ]; then
            echo "::error::PRD_BACKUP_DEST nao configurado."
            echo "A regra de DR do CLAUDE.md exige copia do backup FORA do servidor do banco."
            echo "Sem destino off-server, o deploy em producao NAO prossegue."
            exit 1
          fi

      - name: Backup do banco no host (obrigatorio antes do PRD)
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.PRD_SSH_USER }}@${{ secrets.PRD_SSH_HOST }}" \
            "set -e; \
             mkdir -p ~/Documents/DB_backups; \
             pg_dump '${{ secrets.PRD_DATABASE_URL }}' \
               --no-owner --no-acl --clean --if-exists \
               --file=\"\$HOME/Documents/DB_backups/${{ steps.bk.outputs.file }}\""

      # Dump vazio "com sucesso" e a falha silenciosa classica de DR: so se
      # descobre no dia do restore. 1 KB e generoso — o schema sozinho ja passa.
      - name: Conferir que o dump nao esta vazio
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.PRD_SSH_USER }}@${{ secrets.PRD_SSH_HOST }}" \
            "set -e; \
             f=\"\$HOME/Documents/DB_backups/${{ steps.bk.outputs.file }}\"; \
             bytes=\$(wc -c < \"\$f\"); \
             echo \"backup: \$bytes bytes\"; \
             if [ \"\$bytes\" -lt 1024 ]; then echo 'BACKUP SUSPEITO (< 1KB)'; exit 1; fi; \
             grep -q 'PostgreSQL database dump' \"\$f\" || { echo 'nao parece um dump'; exit 1; }"

      # Copia HOST -> DESTINO. O dump nunca toca a infraestrutura do GitHub.
      - name: Copiar backup para FORA do servidor do banco (regra DR)
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.PRD_SSH_USER }}@${{ secrets.PRD_SSH_HOST }}" \
            "set -e; \
             scp -o StrictHostKeyChecking=yes \
               \"\$HOME/Documents/DB_backups/${{ steps.bk.outputs.file }}\" \
               '${{ secrets.PRD_BACKUP_DEST }}/${{ steps.bk.outputs.file }}'"

      - name: Deploy na VPS PRD
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.PRD_SSH_USER }}@${{ secrets.PRD_SSH_HOST }}" \
            "set -e; \
             cd '${{ secrets.PRD_APP_DIR }}'; \
             git fetch --all; \
             git reset --hard origin/master; \
             npm ci; \
             npm run build; \
             npm run db:migrate --if-present; \
             pm2 reload ecosystem.config.js --update-env || pm2 start ecosystem.config.js"
